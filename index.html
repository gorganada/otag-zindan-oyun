<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#070a12">
  <meta name="apple-mobile-web-app-title" content="Oathfire">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="ikon-180.png">
  <link rel="icon" type="image/png" sizes="192x192" href="ikon-192.png">
  <title>Oathfire · Yemin Ateşi</title>
  <style>
    html, body { margin: 0; height: 100%; background: #070a12; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #070a12; outline: none; }
    #yukleme {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #1b2a4a 0%, #0c1222 55%, #05070d 100%);
      color: #d8e2f2; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 16px; box-sizing: border-box;
      transition: opacity .6s ease;
    }
    #yukleme h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); letter-spacing: 2px; text-shadow: 0 3px 0 #000, 0 0 24px rgba(90,150,255,.35); }
    #yukleme .alt { margin: 0; color: #b8c6dc; font-size: clamp(13px, 2.2vw, 18px); }
    .cubuk { width: min(420px, 80vw); height: 14px; border-radius: 8px; background: #000a; border: 1px solid #5d6f8f; overflow: hidden; }
    #dolu { height: 100%; width: 0; background: linear-gradient(90deg, #3d6fd8, #9cc4ff); box-shadow: 0 0 10px #4f8cff88; transition: width .2s; }
    #durum { margin: 0; font-size: 14px; color: #9aa8c0; }
    #ipucu { margin: 0; max-width: 560px; font-size: 13px; color: #7d8aa3; }
    /* iPhone Safari: ana ekrana ekleme ipucu (uygulama gibi açılınca görünmez) */
    #ekle { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(10px + env(safe-area-inset-bottom)); z-index: 6; display: none;
      max-width: min(92vw, 520px); padding: 10px 34px 10px 14px; border-radius: 12px; border: 1px solid #5d6f8f; background: #101828f2;
      color: #d8e2f2; font: 14px/1.4 Georgia, serif; box-shadow: 0 6px 24px #000a; }
    #ekleKapat { position: absolute; right: 10px; top: 8px; cursor: pointer; color: #9aa8c0; }
    #tam {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 4px; z-index: 5; display: none; padding: 6px 10px; opacity: .85; border-radius: 10px; border: 1px solid #5d6f8f;
      background: #101828e6; color: #d8e2f2; font: 600 14px Georgia, serif;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="yukleme">
    <h1><img src="TemplateData/logo.png" alt="Oathfire" style="width:min(80vw,560px);height:auto;filter:drop-shadow(0 0 22px rgba(80,140,255,.45))"></h1>
    <p class="alt">Krallığını kur · Kahramanlarını topla · Zindanlara gir</p>
    <div class="cubuk"><div id="dolu"></div></div>
    <p id="durum">Yükleniyor…</p>
    <p id="ipucu">İpucu: telefonda yatay tut. Haritayı parmağınla sürükle, iki parmakla yakınlaştır.</p>
  </div>
  <button id="tam">Tam ekran</button>
  <div id="ekle"><b>Uygulama gibi oyna:</b> alttaki <b>Paylaş</b> simgesine dokun, sonra <b>Ana Ekrana Ekle</b>. Oathfire ikonuyla, tam ekran açılır.<span id="ekleKapat">✕</span></div>
  <script>
    var ipuclari = [
      "İpucu: telefonda yatay tut. Haritayı parmağınla sürükle, iki parmakla yakınlaştır.",
      "İpucu: zindanda kırmızı alandan kaç, sarı alana arkadaşlarınla gir.",
      "İpucu: kâhin büyü yaparken mor KES düğmesine bas.",
      "İpucu: her gün giriş yap, VIP puanın ve seri ödülün artsın.",
      "İpucu: klana katıl, üyeler inşaatına yardım etsin."
    ];
    document.getElementById("ipucu").textContent = ipuclari[Math.floor(Math.random() * ipuclari.length)];
    var canvas = document.getElementById("unity-canvas");
    var mobil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/OtagZindan_Web.data.unityweb",
      frameworkUrl: buildUrl + "/OtagZindan_Web.framework.js.unityweb",
      codeUrl: buildUrl + "/OtagZindan_Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Otag",
      productName: "Oathfire · Yemin Ateşi",
      productVersion: "0.0.056",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobil ? 2 : 2),
    };
    var tam = document.getElementById("tam");
    // ana ekrandan (uygulama gibi) açıldı mı: tam ekran düğmesi ve ekleme ipucu gerekmez
    var uygulama = window.navigator.standalone === true || (window.matchMedia && window.matchMedia("(display-mode: standalone), (display-mode: fullscreen)").matches);
    var ios = /iPhone|iPad|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
    if (ios && !uygulama) {
      var ekle = document.getElementById("ekle");
      var kapali = false; try { kapali = localStorage.getItem("ekleKapali") === "1"; } catch (e) {}
      if (!kapali) {
        ekle.style.display = "block";
        document.getElementById("ekleKapat").onclick = function () { ekle.style.display = "none"; try { localStorage.setItem("ekleKapali", "1"); } catch (e) {} };
        setTimeout(function () { ekle.style.display = "none"; }, 20000);
      }
    }
    function tamEkran() {
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) { try { var p = f.call(el); if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {}); } catch (e) {} }
    }
    tam.onclick = tamEkran;
    // telefonda ilk dokunuşta tam ekrana geçmeyi dene
    if (mobil && !uygulama) document.addEventListener("touchend", function ilk() { tamEkran(); document.removeEventListener("touchend", ilk); }, { once: true });
    var s = document.createElement("script");
    s.src = buildUrl + "/OtagZindan_Web.loader.js";
    s.onload = function () {
      createUnityInstance(canvas, config, function (ilerleme) {
        document.getElementById("dolu").style.width = Math.round(ilerleme * 100) + "%";
        document.getElementById("durum").textContent = ilerleme < 0.9 ? "Yükleniyor… %" + Math.round(ilerleme * 100) : "Krallık hazırlanıyor…";
      }).then(function (u) {
        window.unityInstance = u;
        var y = document.getElementById("yukleme");
        y.style.opacity = 0; setTimeout(function () { y.remove(); }, 700);
        if (!uygulama && (document.fullscreenEnabled || document.webkitFullscreenEnabled)) tam.style.display = "block";
        document.addEventListener("fullscreenchange", function () { tam.style.display = document.fullscreenElement ? "none" : "block"; });
        // birkaç saniye sonra soluklaş: oyunun alt menüsünü kapatmasın
        setTimeout(function () { tam.style.transition = "opacity .6s"; tam.style.opacity = ".25"; }, 7000);
        tam.addEventListener("mouseenter", function () { tam.style.opacity = "1"; });
      }).catch(function (m) { document.getElementById("durum").textContent = "Hata: " + m; });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
