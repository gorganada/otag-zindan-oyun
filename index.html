<!DOCTYPE html>
<html lang="tr">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, height=device-height, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="theme-color" content="#140e09">
  <title>Otağ ve Zindan</title>
  <style>
    html, body { margin: 0; height: 100%; background: #140e09; overflow: hidden; touch-action: none; -webkit-user-select: none; user-select: none; }
    #unity-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; height: 100dvh; display: block; background: #140e09; outline: none; }
    #yukleme {
      position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
      background: radial-gradient(ellipse at 50% 40%, #3a2614 0%, #1a110a 55%, #0c0805 100%);
      color: #e8c26b; font-family: Georgia, "Times New Roman", serif; text-align: center; padding: 16px; box-sizing: border-box;
      transition: opacity .6s ease;
    }
    #yukleme h1 { margin: 0; font-size: clamp(34px, 7vw, 72px); letter-spacing: 2px; text-shadow: 0 3px 0 #000, 0 0 24px rgba(232,170,80,.35); }
    #yukleme .alt { margin: 0; color: #cdb998; font-size: clamp(13px, 2.2vw, 18px); }
    .cubuk { width: min(420px, 80vw); height: 14px; border-radius: 8px; background: #000a; border: 1px solid #6b4a24; overflow: hidden; }
    #dolu { height: 100%; width: 0; background: linear-gradient(90deg, #b9832f, #f0c868); transition: width .2s; }
    #durum { margin: 0; font-size: 14px; color: #a99677; }
    #ipucu { margin: 0; max-width: 560px; font-size: 13px; color: #8c7b62; }
    #tam {
      position: fixed; left: 50%; transform: translateX(-50%); bottom: 4px; z-index: 5; display: none; padding: 6px 10px; opacity: .85; border-radius: 10px; border: 1px solid #6b4a24;
      background: #2a1c10e6; color: #e8c26b; font: 600 14px Georgia, serif;
    }
  </style>
</head>
<body>
  <canvas id="unity-canvas" tabindex="-1"></canvas>
  <div id="yukleme">
    <h1>Otağ ve Zindan</h1>
    <p class="alt">Krallığını kur · Kahramanlarını topla · Zindanlara gir</p>
    <div class="cubuk"><div id="dolu"></div></div>
    <p id="durum">Yükleniyor…</p>
    <p id="ipucu">İpucu: telefonda yatay tut. Haritayı parmağınla sürükle, iki parmakla yakınlaştır.</p>
  </div>
  <button id="tam">Tam ekran</button>
  <script>
    var ipuclari = [
      "İpucu: telefonda yatay tut. Haritayı parmağınla sürükle, iki parmakla yakınlaştır.",
      "İpucu: zindanda kırmızı alandan kaç, sarı alana arkadaşlarınla gir.",
      "İpucu: kâhin büyü yaparken mor KES düğmesine bas.",
      "İpucu: her gün giriş yap, VIP puanın ve seri ödülün artsın.",
      "İpucu: klana katıl, üyeler inşaatına yardım etsin."
    ];
    document.getElementById("ipucu").textContent = ipuclari[Math.floor(Math.random() * ipuclari.length)];
    var canvas = document.getElementById("unity-canvas");
    var mobil = /iPhone|iPad|iPod|Android/i.test(navigator.userAgent);
    var buildUrl = "Build";
    var config = {
      dataUrl: buildUrl + "/OtagZindan_Web.data.unityweb",
      frameworkUrl: buildUrl + "/OtagZindan_Web.framework.js.unityweb",
      codeUrl: buildUrl + "/OtagZindan_Web.wasm.unityweb",
      streamingAssetsUrl: "StreamingAssets",
      companyName: "Otag",
      productName: "Otağ ve Zindan",
      productVersion: "1.0",
      devicePixelRatio: Math.min(window.devicePixelRatio || 1, mobil ? 1.5 : 2),
    };
    var tam = document.getElementById("tam");
    function tamEkran() {
      var el = document.documentElement;
      var f = el.requestFullscreen || el.webkitRequestFullscreen;
      if (f) { try { var p = f.call(el); if (p && p.then) p.then(function () { if (screen.orientation && screen.orientation.lock) screen.orientation.lock("landscape").catch(function () {}); }).catch(function () {}); } catch (e) {} }
    }
    tam.onclick = tamEkran;
    // telefonda ilk dokunuşta tam ekrana geçmeyi dene
    if (mobil) document.addEventListener("touchend", function ilk() { tamEkran(); document.removeEventListener("touchend", ilk); }, { once: true });
    var s = document.createElement("script");
    s.src = buildUrl + "/OtagZindan_Web.loader.js";
    s.onload = function () {
      createUnityInstance(canvas, config, function (ilerleme) {
        document.getElementById("dolu").style.width = Math.round(ilerleme * 100) + "%";
        document.getElementById("durum").textContent = ilerleme < 0.9 ? "Yükleniyor… %" + Math.round(ilerleme * 100) : "Krallık hazırlanıyor…";
      }).then(function (u) {
        window.unityInstance = u;
        var y = document.getElementById("yukleme");
        y.style.opacity = 0; setTimeout(function () { y.remove(); }, 700);
        if (document.fullscreenEnabled || document.webkitFullscreenEnabled) tam.style.display = "block";
        document.addEventListener("fullscreenchange", function () { tam.style.display = document.fullscreenElement ? "none" : "block"; });
      }).catch(function (m) { document.getElementById("durum").textContent = "Hata: " + m; });
    };
    document.body.appendChild(s);
  </script>
</body>
</html>
